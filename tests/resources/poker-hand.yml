data:
  PokerHand:
    training: &dataset
#      file: https://archive.ics.uci.edu/static/public/158/poker+hand.zip
      file: datasets/poker-hand/poker-hand-training.csv
#      unpack: datasets/poker-hand/poker-hand-training-true.data
#      type: csv(',')
#      percent: 80%
    test:
      file: datasets/poker-hand/poker-hand-testing.csv
#      unpack: datasets/poker-hand/poker-hand-testing.data
    features:
      - name: suit1 # ordinal (1-4) representing {hearts, spades, diamonds, clubs}
        values: &suits [hearts, spades, diamonds, clubs]
        mapping: &suits_mapping
          hearts: 1
          spades: 2
          diamonds: 3
          clubs: 4
      - name: rank1 # numerical (1-13) representing (1=ace, 2, 3, ..., 11=jack, 12=queen, 13=king)
        values: &ranks [ace, 2, 3, 4, 5, 6, 7, 8, 9, 10, jack, queen, king]
        mapping: &ranks_mapping
          ace: 1
          jack: 11
          queen: 12
          king: 13
      - name: suit2 # ordinal (1-4) representing
        values: *suits
        mapping: *suits_mapping
      - name: rank2 # numerical (1-13) representing
        values: *ranks
        mapping: *ranks_mapping
      - name: suit3 # ordinal (1-4) representing
        values: *suits
        mapping: *suits_mapping
      - name: rank3 # numerical (1-13) representing
        values: *ranks
        mapping: *ranks_mapping
      - name: suit4 # ordinal (1-4) representing
        values: *suits
        mapping: *suits_mapping
      - name: rank4 # numerical (1-13) representing
        values: *ranks
        mapping: *ranks_mapping
      - name: suit5 # ordinal (1-4) representing
        values: *suits
        mapping: *suits_mapping
      - name: rank5 # numerical (1-13) representing
        values: *ranks
        mapping: *ranks_mapping
#      - group: suits
#        features: [suit1, suit2, suit3, suit4, suit5]
#      - group: ranks
#        features: [rank1, rank2, rank3, rank4, rank5]
    target:
      name: Class
      values:
        - nothing            # Nothing in hand; not a recognized poker hand
        - one_pair           # One pair; one pair of equal ranks within five cards
        - two_pairs          # Two pairs; two pairs of equal ranks within five cards
        - three_of_a_kind    # Three of a kind; three equal ranks within five cards
        - straight           # Straight; five cards, sequentially ranked with no gaps
        - flush              # Flush; five cards with the same suit
        - full_house         # Full house; pair + different rank three of a kind
        - four_of_a_kind     # Four of a kind; four equal ranks within five cards
        - straight_flush     # Straight flush; straight + flush
        - royal_flush        # Royal flush; {Ace, King, Queen, Jack, Ten} + flush
      mapping:
        nothing: 0
        one_pair: 1
        two_pairs: 2
        three_of_a_kind: 3
        straight: 4
        flush: 5
        full_house: 6
        four_of_a_kind: 7
        straight_flush: 8
        royal_flush: 9

instances:
  - hand: poker-hand

optimization:
  epochs: 2
  learning_rate: 0.001
  loss: cross_entropy
  metrics: [accuracy]
  batch_size: 512

learnable:
  PokerHand:
    dataset: PokerHand
    inputs:
      - PokerHand.features
    outputs:
      - source: features.Class
        transform: one_hot_encoding
    type: feed_forward
    layers:
      - linear:
          input: 256
          output: 128
          activation: leaky_relu
  #        regularization: l2
          dropout: 0.2
      - linear:
          input: 128
          output: 10
          activation: softmax

knowledge:
  - rule: Pair
    args: [hand]
    # BETTER_RULE: min_repetitions(2, hand.ranks)
    clause: |
      (hand[rank1] == hand[rank2]) | (hand[rank1] == hand[rank3]) | (hand[rank1] == hand[rank4]) | (hand[rank1] == hand[rank5]) | 
      (hand[rank2] == hand[rank3]) | (hand[rank2] == hand[rank4]) | (hand[rank2] == hand[rank5]) | (hand[rank3] == hand[rank4]) | 
      (hand[rank3] == hand[rank5]) | (hand[rank4] == hand[rank5])

  - rule: Two_pairs
    args: [hand]
    # BETTER_RULE: min_true(2, (r1 == r2 for r1, r2 in combinations(hand.ranks, 2)))
    clause: |
      ((hand[rank1] == hand[rank2]) & ((hand[rank3] == hand[rank4]) | (hand[rank3] == hand[rank5]) | (hand[rank4] == hand[rank5]))) | 
      ((hand[rank1] == hand[rank3]) & ((hand[rank2] == hand[rank4]) | (hand[rank2] == hand[rank5]) | (hand[rank4] == hand[rank5]))) | 
      ((hand[rank1] == hand[rank4]) & ((hand[rank2] == hand[rank3]) | (hand[rank2] == hand[rank5]) | (hand[rank3] == hand[rank5]))) | 
      ((hand[rank1] == hand[rank5]) & ((hand[rank2] == hand[rank3]) | (hand[rank2] == hand[rank4]) | (hand[rank3] == hand[rank4])))

  - rule: Three_of_a_kind
    args: [hand]
    # BETTER_RULE: min_repetitions(3, hand.ranks)
    clause: |
      ((hand[rank1] == hand[rank2]) & (hand[rank1] == hand[rank3])) | 
      ((hand[rank1] == hand[rank2]) & (hand[rank1] == hand[rank4])) | 
      ((hand[rank1] == hand[rank2]) & (hand[rank1] == hand[rank5])) | 
      ((hand[rank1] == hand[rank3]) & (hand[rank1] == hand[rank4])) | 
      ((hand[rank1] == hand[rank3]) & (hand[rank1] == hand[rank5])) | 
      ((hand[rank1] == hand[rank4]) & (hand[rank1] == hand[rank5])) | 
      ((hand[rank2] == hand[rank3]) & (hand[rank2] == hand[rank4])) | 
      ((hand[rank2] == hand[rank3]) & (hand[rank2] == hand[rank5])) | 
      ((hand[rank2] == hand[rank4]) & (hand[rank2] == hand[rank5])) | 
      ((hand[rank3] == hand[rank4]) & (hand[rank3] == hand[rank5]))

  - rule: Maximum_Straight
    args: [hand]
    clause: | 
      contains(concat(hand[rank1], hand[rank2], hand[rank3], hand[rank4], hand[rank5]), 1) & 
      contains(concat(hand[rank1], hand[rank2], hand[rank3], hand[rank4], hand[rank5]), 10) & 
      contains(concat(hand[rank1], hand[rank2], hand[rank3], hand[rank4], hand[rank5]), 11) & 
      contains(concat(hand[rank1], hand[rank2], hand[rank3], hand[rank4], hand[rank5]), 12) & 
      contains(concat(hand[rank1], hand[rank2], hand[rank3], hand[rank4], hand[rank5]), 13)

  - rule: Straight
    args: [hand]
    # BETTER_RULE: min_true(1, ((r1 == r2 + 1 | r2 == r1 + 12) & r2 == r3 + 1 & r3 == r4 + 1 & r4 == r5 + 1 for r1, r2, r3, r4, r5 in permutations(hand.ranks, 5)))
    # The better rule considers also the case {10, 11, 12, 13, 1}.
    # FIXME: the rule below will not work: there are no guarantees that the ranks are sorted
    # FIXME: both rules are not adequate, because they do not consider the case {10, 11, 12, 13, 1}
#    clause: |
#      (hand[rank1] == hand[rank2] + 1 & hand[rank2] == hand[rank3] + 1 & hand[rank3] == hand[rank4] + 1 & hand[rank4] == hand[rank5] + 1) or
#      (hand[rank1] == hand[rank2] - 1 & hand[rank2] == hand[rank3] - 1 & hand[rank3] == hand[rank4] - 1 & hand[rank4] == hand[rank5] - 1)
    clause: Maximum_Straight(hand) | (variance(concat(hand[rank1], hand[rank2], hand[rank3], hand[rank4], hand[rank5])) == 2.5)

  - rule: Flush
    args: [hand]
    # BETTER_RULE: min_repetitions(5, hand.suits)
    # all_equal(hand.suits)
    clause: (hand[suit1] == hand[suit2]) & (hand[suit1] == hand[suit3]) & (hand[suit1] == hand[suit4]) & (hand[suit1] == hand[suit5])

  - rule: Full_house
    args: [hand]
    # FIXME: the rule will not work because if there is a three of a kind, there is also a pair overlapping with it
    clause: Three_of_a_kind(hand) & Pair(hand)

  - rule: Four_of_a_kind
    args: [hand]
    # BETTER_RULE: min_repetitions(4, hand.ranks)
    clause: |
      ((hand[rank1] == hand[rank2]) & (hand[rank1] == hand[rank3]) & (hand[rank1] == hand[rank4])) | 
      ((hand[rank1] == hand[rank2]) & (hand[rank1] == hand[rank3]) & (hand[rank1] == hand[rank5])) | 
      ((hand[rank1] == hand[rank2]) & (hand[rank1] == hand[rank4]) & (hand[rank1] == hand[rank5])) | 
      ((hand[rank1] == hand[rank3]) & (hand[rank1] == hand[rank4]) & (hand[rank1] == hand[rank5])) | 
      ((hand[rank2] == hand[rank3]) & (hand[rank2] == hand[rank4]) & (hand[rank2] == hand[rank5]))

  - rule: Straight_flush
    args: [hand]
    clause: Straight(hand) & Flush(hand)

  - rule: Royal_flush
    args: [hand]
    # BETTER_RULE: Straight_flush(hand) & contains(ace, hand.ranks)
    # FIXME: the rule below will not work: it does not consider the case the case {10, 11, 12, 13, 1} (the rule above assumes that the case is handled by Straight)
#    clause: Straight_flush(hand) & (hand[rank1] == ace | hand[rank2] == ace | hand[rank3] == ace | hand[rank4] == ace | hand[rank5] == ace)
    clause: Flush(hand) & Maximum_Straight(hand)

constraints:
  - always: PokerHand(hand) == hand[Class]
    weight: 0.1
  
  - if: Royal_flush(hand)
    then: PokerHand(hand) == royal_flush
    weight: 0.9

  # double implication is not adequate, because if Royal_flush(hand) is True, then Straight_flush(hand) is also True, yet PokerHand(hand) must output royal_flush
  - if: Straight_flush(hand)
    then: PokerHand(hand) == straight_flush
    weight: 0.9

  - if: Four_of_a_kind(hand)
    then: PokerHand(hand) == four_of_a_kind
    weight: 0.9

  - if: Full_house(hand)
    then: PokerHand(hand) == full_house
    weight: 0.9

  - if: Flush(hand)
    then: PokerHand(hand) == flush
    weight: 0.8

  - if: Straight(hand)
    then: PokerHand(hand) == straight
    weight: 0.7

  - if: Three_of_a_kind(hand)
    then: PokerHand(hand) == three_of_a_kind
    weight: 0.5

  - if: Two_pairs(hand)
    then: PokerHand(hand) == two_pairs
    weight: 0.1

  - if: Pair(hand)
    then: PokerHand(hand) == one_pair
    weight: 0.1
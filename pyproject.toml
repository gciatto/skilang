[tool.poetry]
name = "skilang"
packages = [
    { include = "skilang" },
]
version = "0.1.0"
description = "A general purpose language for Symbolic Knowledge Injection"
authors = ["Giovanni Ciatto <giovanni.ciatto@unibo.it>"]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">= 3.10.0 < 3.13.0"
scikit-learn = "^1.5.0"
pandas = "^2.2.2"
torch = "^2.6.0"
pytorchic = "^4.0.2"
openml = "^0.15.1"
fire = "^0.7.0"

[tool.poetry.group.dev.dependencies]
coverage = "^7.4.0"
mypy = "^1.10.1"
poethepoet = "^0.34.0"
poetry = "^2.0.0"
pytest = "^8.2.2"
behave = "^1.2.6"
ruff = "^0.11.5"
types-pyyaml = "^6.0.12.20250402"
types-requests = "^2.32.4.20250611"

[tool.poe.tasks]
bdd-test = "behave tests/features"
test = "python -m unittest discover -v -s tests -p '*.py'"
coverage = "coverage run -m unittest discover -v -s tests -p '*.py'"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy skilang tests"
compile = "python -m compileall skilang tests"
static-checks = [
    "ruff-check",
    "mypy",
]

[tool.poetry.scripts]
skilang = "skilang:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.mypy]
ignore_missing_imports = true
strict_optional = false
